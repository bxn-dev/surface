[workspace]
members = [
    "crates/surface-cli",
    "crates/surface-core",
    "crates/surface-report",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/bxn-dev/surface"
rust-version = "1.85"
readme = "README.md"
keywords = ["security", "scanner", "network", "cli"]
categories = ["command-line-utilities", "network-programming"]

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
futures = "0.3"
hickory-proto = "0.26.1"
hickory-resolver = "0.26.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.49", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
time = { version = "0.3", features = ["serde"] }
tokio-rustls = "0.26"
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.0", features = ["serde", "v4"] }
webpki-roots = "1.0"
x509-parser = "0.18"
surface-core = { version = "0.1.0", path = "crates/surface-core" }
surface-report = { version = "0.1.0", path = "crates/surface-report" }
url = { version = "2.5", features = ["serde"] }

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
